name: Claude Deep Review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-deep-review-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      # Sibling arm to claude-review.yml, without the plugin's own "needs review?" gate, to isolate triggering policy from review quality.
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are reviewing pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Always perform a full review of this pull request. Never skip, decline, or shortcut
            the review because the change looks trivial, automated, generated, or otherwise
            "not worth reviewing" — there is no discretion here: you must always review.

            Examine the diff this pull request introduces across all of the following
            dimensions: security, correctness, concurrency, resource handling, performance,
            error handling, type safety, API contracts, and test quality.

            For every distinct issue you find, post exactly one inline comment on the exact
            line it applies to, using the mcp__github_inline_comment__create_inline_comment
            tool. Every single comment you post must start with the literal marker
            "[deep-review]" as its first text, with no exceptions — this marker is the only
            way to distinguish your comments from another Claude-based reviewer that also
            posts as the claude[bot] account, so omitting it breaks attribution. Each comment
            must also state a severity of one of: critical, high, medium, low.

            Only report real, concrete defects that you can point to in the diff. Do not
            invent or pad findings to appear thorough — precision matters as much as recall.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
