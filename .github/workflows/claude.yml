name: Claude Fix

on:
  issue_comment:
    types: [created]

jobs:
  fix:
    if: >
      github.event.issue.pull_request != null &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: claude-fix-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: before
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(gh pr view "$PR_NUMBER" --json headRefOid -q .headRefOid)
          [ -n "$sha" ] || { echo "::error::head SHA unreadable"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      - id: after
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(gh pr view "$PR_NUMBER" --json headRefOid -q .headRefOid)
          [ -n "$sha" ] || { echo "::error::head SHA unreadable"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # Inline, not a repo script: workflow YAML is read from the default branch and a fork PR cannot edit it.
      - name: Notify Slack
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SHA_BEFORE: ${{ steps.before.outputs.sha }}
          SHA_AFTER: ${{ steps.after.outputs.sha }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          repo_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          pr_url="${repo_url}/pull/${PR_NUMBER}"

          if [ "$JOB_STATUS" != "success" ] || [ -z "$SHA_BEFORE" ] || [ -z "$SHA_AFTER" ]; then
            text="❌ PR #${PR_NUMBER} — Claude fix başarısız. <${RUN_URL}|Run log> · <${pr_url}|PR>"
          elif [ "$SHA_BEFORE" = "$SHA_AFTER" ]; then
            text="ℹ️ PR #${PR_NUMBER} — Claude düzeltecek bir şey bulamadı. <${RUN_URL}|Run log> · <${pr_url}|PR>"
          else
            text="✅ PR #${PR_NUMBER} düzeltildi → <${repo_url}/commit/${SHA_AFTER}|${SHA_AFTER:0:7}> · <${pr_url}|PR>"
          fi

          jq -n --arg t "$text" '{text: $t}' \
            | curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' -d @- "$SLACK_WEBHOOK_URL"
